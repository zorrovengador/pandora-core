name: pandora-core
version: 1.0.1
description: "Pandora Core by Bizbrain: distribución sin provisión de credenciales."
hermes_requires: ">=0.12.0"
author: "Bizbrain"
license: "Proprietary"

# El runtime, modelo y conexiones del tenant se aprovisionan antes de instalar
# esta distribución. Las skills verifican capacidades disponibles; nunca piden
# ni configuran credenciales durante instalación, onboarding o conversación.

distribution_owned:
  - SOUL.md
  - skills/
  - cron/
  - mcp.json
  - distribution.yaml
  - README.md
  - docs/
